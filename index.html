<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بتحبيني؟</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#e6f3ff;--bg2:#9ccbff;--ink:#0a3a7a;--accent:#1e88e5;--glow:rgba(30,136,229,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#06152b;--bg2:#0e3a6e;--ink:#d6ebff;--accent:#5cadff;--glow:rgba(92,173,255,.5)}}
:root[data-theme="dark"]{--bg1:#06152b;--bg2:#0e3a6e;--ink:#d6ebff;--accent:#5cadff;--glow:rgba(92,173,255,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center}
#ask{padding:24px;max-width:480px;width:100%}
#emoji{font-size:64px;transition:transform .3s}
h1{font-size:clamp(26px,7vw,40px);margin:12px 0 28px;min-height:2.6em;transition:opacity .25s}
.btns{display:flex;gap:16px;justify-content:center;align-items:center;min-height:110px}
button{border:0;border-radius:999px;font-weight:700;cursor:pointer;color:#fff;transition:all .25s}
#yes{background:var(--accent);font-size:22px;padding:14px 34px;box-shadow:0 6px 18px var(--glow)}
#no{background:#5f6b7d;font-size:18px;padding:12px 26px}
#stage{display:none;position:relative;width:min(94vw,480px);aspect-ratio:1/1;z-index:1}
#stage.show{display:block}
#stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;direction:ltr;filter:drop-shadow(0 0 6px var(--glow))}
#stage text{fill:var(--ink);font-weight:700;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#stage.beat{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}15%{transform:scale(1.05)}30%{transform:scale(1)}45%{transform:scale(1.035)}}
.fl{position:fixed;bottom:-40px;pointer-events:none;animation:fly linear forwards;z-index:0}
@keyframes fly{0%{transform:translateY(0) rotate(0) scale(.6);opacity:0}12%{opacity:.85}100%{transform:translateY(-115vh) rotate(35deg) scale(1.2);opacity:0}}
#fin{position:absolute;left:0;top:101%;width:100%;direction:ltr;text-align:center;min-height:1.5em;font:italic 700 clamp(18px,5.4vw,28px) Georgia,serif;color:var(--ink);text-shadow:0 0 10px var(--accent),0 0 2px #fff}
#big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(26px,8vw,42px);transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
#big.on{transform:translate(-50%,-50%) scale(1);animation:beat 1.1s infinite .8s}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.2)}}
</style>
</head>
<body>
<div id="ask">
  <div id="emoji">🥰</div>
  <h1 id="q">بتحبيني؟</h1>
  <div class="btns"><button id="yes">أيوه 💙</button><button id="no">لأ</button></div>
</div>
<div id="stage">
  <svg id="svg" viewBox="-20 -20 40 40"><defs id="defs"></defs><g id="g" transform="translate(0,-2.4)"></g></svg>
  <div id="big">💙</div><div id="fin"></div>
</div>
<script>
const msgs=[["إنتي متأكدة؟ 🥺","😢"],["فكري تاني… بجد مش بتحبيني؟","🤔"],["الزرار غلط! جربي تاني 😏","🙈"],["عشان خاطري 🥹","🥹"],["قلبي زعل شوية 💔","💔"],["طيب فرصة أخيرة…","😇"],["أنا مش هزهق، إنتي تستاهلي 💙","🥰"],["قلبي مش هيختار غيرك أبداً 💙","🥹"],["هفضل أختارك في كل كون 🌌","🥰"],["يا مزتي، بطلي تتقلي بقى 😅","😅"],["حتى لو قلتي لأ تاني، هفضل أحبك 🫶","🥺"],["أنا ليكي وإنتي ليا… ولا إيه؟ 😌","😌"],["لو رجعت بيا الأيام هاختارك تاني 🕰️","🥹"],["ماتعمليش فيها صعبة بقى 😘","😘"],
["بتحبيني ولو شوية؟ 🤏","🥺"],["يا كاريزما هانم خفي بقا ودوسي أيوه 😏","😏"],["يلا بقى دوسي أيوه 🙏","🥺"],["يا عمي ما تدوسي بقا زهقتينا 😤","😤"]];
const loves=["I love you","أحبك","Je t’aime","Te quiero","Ich liebe dich","Ti amo","Eu te amo","我爱你","愛してる","사랑해","Я тебя люблю","Σ’αγαπώ","Seni seviyorum","मैं तुमसे प्यार करता हूँ","Ik hou van jou","Jag älskar dig","Kocham cię","אני אוהב אותך","Te iubesc","Mahal kita","Aku cinta kamu","Anh yêu em","ฉันรักเธอ","Ég elska þig","Rakastan sinua","Jeg elsker deg","Miluji tě","Szeretlek","Nakupenda","Ndiyakuthanda","Mi amas vin","بحبك","Tha gaol agam ort","Rwy’n dy garu","Is breá liom thú","Ua alofa a’u ia te oe","Aloha au iā ʻoe","Ես սիրում եմ քեզ","მიყვარხარ","Men seni sevaman","Мен сені жақсы көремін","دوستت دارم","আমি তোমাকে ভালোবাসি","Jeg elsker dig","Volim te","Обичам те","Es tevi mīlu","Aš tave myliu","Ma armastan sind","Mən səni sevirəm","Ngiyakuthanda","Të dua","Ek is lief vir jou"];
let i=0;const q=document.getElementById('q'),em=document.getElementById('emoji'),yes=document.getElementById('yes'),no=document.getElementById('no');
no.onclick=()=>{
  const m=msgs[i%msgs.length];i++;
  q.style.opacity=0;
  setTimeout(()=>{q.textContent=m[0];em.textContent=m[1];q.style.opacity=1},200);
  yes.style.fontSize=Math.min(22+i*4,52)+'px';yes.style.padding=(14+i*2)+'px '+(34+i*5)+'px';
  no.style.fontSize=Math.max(18-i,9)+'px';no.style.padding=Math.max(12-i,4)+'px '+Math.max(26-i*2,10)+'px';
  em.style.transform='scale(1.25) rotate('+(i%2?-12:12)+'deg)';setTimeout(()=>em.style.transform='',300);
};
function pt(t,s){return[(16*Math.pow(Math.sin(t),3))*s,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s]}
function mkPath(a,b,s){let d='';const N=220;for(let k=0;k<=N;k++){const p=pt(a+(b-a)*k/N,s);d+=(k?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2)}return d}
const NS='http://www.w3.org/2000/svg',SEP=' • ',iso=w=>'\u2066'+w+'\u2069';
let wi=0;
function build(){
  const defs=document.getElementById('defs'),g=document.getElementById('g');
  // each ring = upper half (two lobes) + lower half (to the tip), both drawn left→right so the words always read upright
  const rings=[1.05,.78,.51];
  rings.forEach((s,r)=>{
    [[1.5*Math.PI,2.5*Math.PI],[1.5*Math.PI,.5*Math.PI]].forEach(([a,b],h)=>{
      const id=r*2+h,d=mkPath(a,b,s);
      const p=document.createElementNS(NS,'path');p.setAttribute('id','p'+id);p.setAttribute('d',d);defs.appendChild(p);
      const L=p.getTotalLength();
      const t=document.createElementNS(NS,'text');t.setAttribute('font-size','1.05');t.style.opacity=0;t.style.transition='opacity 1.6s ease';
      const tp=document.createElementNS(NS,'textPath');tp.setAttribute('href','#p'+id);t.appendChild(tp);g.appendChild(t);
      // fill the path with as many words as fit, then spread the gaps so it ends exactly at the path's end
      let s2='',prev='';
      for(let n=0;n<120;n++){
        prev=s2;s2+=(s2?SEP:'')+iso(loves[wi%loves.length]);wi++;
        tp.textContent=s2;
        if(t.getComputedTextLength()>L){if(prev){s2=prev;wi--}break}
      }
      tp.textContent=s2;
      const spaces=(s2.match(/ /g)||[]).length||1;
      t.style.wordSpacing=Math.max(0,(L-t.getComputedTextLength())/spaces)+'px';
      setTimeout(()=>{t.style.opacity=1},300+r*700+h*350);
    });
  });
}
yes.onclick=()=>{
  document.getElementById('ask').style.display='none';
  const st=document.getElementById('stage');st.classList.add('show');
  build();
  setTimeout(()=>{document.getElementById('big').classList.add('on');st.classList.add('beat')},3200);
  const txt=' sandosa will always be my only wife 💍';
  setTimeout(()=>{const f=document.getElementById('fin');let k=0;const iv=setInterval(()=>{k++;f.textContent=[...txt].slice(0,k).join('');if(k>=[...txt].length)clearInterval(iv)},90)},4200);
  const fe=['💙','🩵','💎','✨','🦋','🫧'];
  setInterval(()=>{const f=document.createElement('div');f.className='fl';f.textContent=fe[Math.floor(Math.random()*fe.length)];f.style.left=Math.random()*100+'vw';f.style.fontSize=(14+Math.random()*22)+'px';f.style.animationDuration=(5+Math.random()*5)+'s';document.body.appendChild(f);setTimeout(()=>f.remove(),10500)},350);
};
</script>
</body>
</html>
